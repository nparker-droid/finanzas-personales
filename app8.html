(function(){
  function show(msg){var s=document.getElementById("splash"); if(s) s.textContent="⚠ "+msg;}
  window.addEventListener("error",function(ev){
    if(ev.target&&ev.target.src){ show("No cargó: "+ev.target.src.split("/").pop()); return; }
    show("Error: "+(ev.message||"desconocido")+(ev.lineno?" (línea "+ev.lineno+")":""));
  },true);
  window.addEventListener("unhandledrejection",function(ev){
    show("Error (promesa): "+((ev.reason&&ev.reason.message)||ev.reason));
  });
  setTimeout(function(){
    var faltan=["React","ReactDOM","Recharts","Babel"].filter(function(n){return !window[n];});

  },8000);
})();

const accNorm=s=>{s=(s||"").trim().toUpperCase(); if(!s) return "";

  return "";};
const parseFijosCSV = txt => {
  const out=[];let row=[],cur="",q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(cur);cur="";}
    else if(c==='\n'||c==='\r'){ if(cur!==""||row.length){row.push(cur);out.push(row);row=[];cur="";} if(c==='\r'&&txt[i+1]==='\n')i++; }
    else cur+=c;
  }
  if(cur!==""||row.length){row.push(cur);out.push(row);}
  const [hdr,...body]=out; if(!hdr) return [];
  const H=hdr.map(h=>h.trim().toLowerCase());
  const g=(r,k)=>{const ix=H.indexOf(k);return ix>=0?(r[ix]||"").trim():"";};
  return body.filter(r=>g(r,"nombre")).map(r=>({
    nombre:g(r,"nombre"), categoria:g(r,"categoria")||"Otros",
    monto:Number(g(r,"monto").replace(/[^0-9\-]/g,""))||0,
    dia:Number(g(r,"dia"))||1, patron:(g(r,"patron")||g(r,"nombre")).toLowerCase(),
    activo:!["false","0","no"].includes(g(r,"activo").toLowerCase()),
    // columna "cuenta" (o "tarjeta") de la sheet; si no existe, hereda de la lista embebida por nombre
    cuenta:accNorm(g(r,"cuenta")||g(r,"tarjeta"))||((FIJOS_DEF.find(d=>d.nombre.toLowerCase()===g(r,"nombre").trim().toLowerCase())||{}).cuenta||""),
  }));
};

const leerToken=()=>{
  try{ const u=new URL(location.href); const k=u.searchParams.get("k");
    if(k){ localStorage.setItem(TOKEN_KEY,k); u.searchParams.delete("k"); history.replaceState(null,"",u.pathname+(u.search||"")+u.hash); return k; } }catch(e){}
  try{ return localStorage.getItem(TOKEN_KEY)||""; }catch(e){ return ""; }

const useMobile = () => {
  const [mb,setMb]=useState(()=>window.matchMedia("(max-width:760px)").matches);
  useEffect(()=>{
    const mq=window.matchMedia("(max-width:760px)");
    const h=e=>setMb(e.matches);
    mq.addEventListener?mq.addEventListener("change",h):mq.addListener(h);
    return()=>{mq.removeEventListener?mq.removeEventListener("change",h):mq.removeListener(h);};
  },[]);
  return mb;
};

// Persistencia: window.storage (entorno Claude) con fallback a localStorage (navegador normal)
const store = {
  async get(k){ try{ if(window.storage){const g=await window.storage.get(k); return g?g.value:null;} }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){ return null; } },
  async set(k,v){ try{ if(window.storage){ await window.storage.set(k,v,false); return; } }catch(e){}
    try{ localStorage.setItem(k,v); }catch(e){} },
  async list(p){ try{ if(window.storage){const r=await window.storage.list(p); if(r&&r.keys) return r.keys;} }catch(e){}
    try{ return Object.keys(localStorage).filter(k=>k.startsWith(p)); }catch(e){ return []; } },
};

.alert{background:#FFF4E5;border-radius:14px;padding:12px 14px;font-size:13px;color:#7A4A00;line-height:1.45;}
.strip{background:#fff;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.strip .k{font-size:12px;color:var(--muted);}
.strip .v{font-size:17px;font-weight:800;}
/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid #DADCE3;padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);z-index:20;}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));}
.tabbar button{border:0;background:transparent;font:inherit;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-height:48px;}
.tabbar button.on{color:var(--blue);font-weight:700;}
/* hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#F2F2F7;border-radius:22px 22px 0 0;width:100%;max-width:560px;padding:18px 20px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto;}
.grab{width:40px;height:5px;border-radius:3px;background:#C9CDD6;align-self:center;}
/* cuotas */
.navy{background:var(--navy);color:#fff;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;}
.navy .k{font-size:12.5px;color:#B9C2D6;}
.navy .big{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.05;}
.navy .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border-top:1px solid var(--navy2);padding-top:12px;}
.navy .g2 .v{font-size:15px;font-weight:700;}
.chart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;}
.chart .col{display:flex;flex-direction:column;gap:3px;}
.chart .kk{font-size:9px;color:var(--muted);text-align:center;}
.chart .bars{height:140px;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;}
.chart .bars i{display:block;border-radius:2px;}
.chart .m{font-size:11px;text-align:center;color:var(--muted);}
.chart .m.on{color:var(--ink);font-weight:800;}
.qc{background:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
.qc .t{display:flex;align-items:center;gap:10px;}
.qc .t .n{font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qc .t .v{font-size:15px;font-weight:800;white-space:nowrap;}
.qc .pb{height:6px;border-radius:3px;background:#EEF1F6;overflow:hidden;}
.qc .pb i{display:block;height:100%;border-radius:3px;}
.qc .f{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);}
.sq{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block;}
.chk{width:28px;height:28px;border-radius:14px;border:2px solid #C9CDD6;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.chk.on{background:var(--save);border-color:var(--save);color:#fff;}
.chk:disabled{cursor:default;}
.lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;}
.lg span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted2);}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);padding:0 4px;}
.kv b{color:var(--ink);}
table.mt{width:100%;border-collapse:collapse;min-width:560px;}
.mt th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:right;font-weight:700;padding:8px;border-bottom:1px solid var(--line);}
.mt th:first-child,.mt td:first-child{text-align:left;}
.mt td{padding:8px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:right;}
`;

const MESL=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const mesLargo=c=>{const [y,m]=c.split("-").map(Number); return MESL[m-1]+(y!==Number(HOY.slice(0,4))?" "+y:"");};
const AYER=(()=>{const d=new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+"-"+pp(d.getMonth()+1)+"-"+pp(d.getDate());})();
const DIAS=["dom","lun","mar","mié","jue","vie","sáb"];
const diaLbl=f=>{ if(f===HOY) return "Hoy"; if(f===AYER) return "Ayer"; const [y,m,d]=f.split("-").map(Number); return DIAS[new Date(y,m-1,d).getDay()]+" "+d+" "+MESN[m-1]; };
const FECHA_HOY=(()=>{const d=new Date(); const s=d.toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"}).replace(",",""); return s.charAt(0).toUpperCase()+s.slice(1);})();
const kfmt=n=>"$"+Math.round(n/1000)+"k";
const QPAL=["#1F4FBF","#7FB0FF","#14213D","#4C7BE0","#BFD0F7","#2E5FA8","#9AB4E8","#5B6170"];
const FPAL=["#14213D","#1F4FBF","#7FB0FF","#C3CBDB","#4C7BE0","#9AA6C0","#2E5FA8"];
const BKS={cons:{bg:"#FFE9D9",fg:"#8A3B00"},cuota:{bg:"#E6EEFF",fg:"#163A8C"},fijo:{bg:"#ECEDF1",fg:"#3F4554"},vac:{bg:"#FDEBC8",fg:"#7A4A00"},in:{bg:"#E3F5EA",fg:"#1D6B3A"},excl:{bg:"#ECEDF1",fg:"#5B6170"}};

const Ico={
  wallet:<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/></svg>,
  cuotas:<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M4 20V14M10 20V9M16 20V12M22 20V5"/></svg>,
  fijos:<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16"/></svg>,
  mas:<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>,
  buscar:<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>,
  check:<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5 9-10"/></svg>,
};

function App(){
  const [tab,setTab]=useState("wallet");
  const [ovr,setOvr]=useState({});
  const [vac,setVac]=useState(null);
  const [ready,setReady]=useState(false);
  const [meta,setMeta]=useState(700000);
  const [sueldo,setSueldo]=useState(1870000);
  const [fAcc,setFAcc]=useState("todas");
  const [fCat,setFCat]=useState("todas");
  const [fTipo,setFTipo]=useState("todo");
  const [q,setQ]=useState("");
  const [showExcl,setShowExcl]=useState(false);
  const [buscar,setBuscar]=useState(false);
  const [nVer,setNVer]=useState(12);
  const [sel,setSel]=useState(null);
  const [verPagadas,setVerPagadas]=useState(false);
  const [ciclo,setCiclo]=useState(CICLOS.includes(CICLO_HOY)?CICLO_HOY:(CICLOS[0]||CICLO_HOY));
  const [vacKeys,setVacKeys]=useState(new Set());
  const [rows0,setRows0]=useState(DATA_C);
  const [fuente,setFuente]=useState(REMOTE_URL?"cargando remota…":"embebida");
  const [token,setToken]=useState(leerToken);
  const [needKey,setNeedKey]=useState(false);
  const [keyIn,setKeyIn]=useState("");
  const [sync,setSync]=useState("");
  const [log,setLog]=useState(()=>{ try{ return JSON.parse(localStorage.getItem("fin_log")||"[]"); }catch(e){ return []; } });
  const metaT=useRef(null), sueldoT=useRef(null), carRef=useRef(null), curRef=useRef(null), carT=useRef(null), listRef=useRef(null);
  // registro local de cambios (además del registro en Drive vía Apps Script)
  const logCambio=(desc)=>{ setLog(p=>{ const l=[{ts:new Date().toISOString(),desc},...p].slice(0,100); try{ localStorage.setItem("fin_log",JSON.stringify(l)); }catch(e){} return l; }); };
  // v19: cada cambio se guarda en Drive (ajustes_app.json) vía Apps Script; si falla queda en cola local
  const pushCambio=(cambios)=>{
    let cola=[]; try{ cola=JSON.parse(localStorage.getItem("fin_cola")||"[]"); }catch(e){}
    cola=cola.concat(cambios);
    try{ localStorage.setItem("fin_cola",JSON.stringify(cola)); }catch(e){}
    if(!REMOTE_URL||!token){ setSync("guardado solo en este equipo"); return; }
    setSync("guardando…");
    fetch(REMOTE_URL,{method:"POST",body:JSON.stringify({k:token,cambios:cola})})
      .then(r=>r.json()).then(j=>{
        if(j&&j.ok){ try{ localStorage.setItem("fin_cola","[]"); }catch(e){} setSync("✓ guardado "+new Date().toTimeString().slice(0,5)); }
        else setSync("⚠ no se guardó en la nube ("+((j&&j.error)||"error")+")");
      }).catch(()=>setSync("⚠ sin conexión: se guardará al reconectar"));
  };
  const guardarToken=()=>{ const k=keyIn.trim(); if(!k) return; try{localStorage.setItem(TOKEN_KEY,k);}catch(e){} setToken(k); setFuente("cargando remota…"); };
  const [fijos,setFijos]=useState(FIJOS_DEF);
  const [fuenteFijos,setFuenteFijos]=useState(FIJOS_CSV_URL?"cargando…":"lista embebida");
  const [fijoChk,setFijoChk]=useState({});
  const vacStored=useRef({});

  useEffect(()=>{(async()=>{
    let o={}, v={};
    try{
      for(const k of await store.list("cat:")){const g=await store.get(k);if(g!=null)o[k.slice(4)]=g;}
      for(const k of await store.list("vac:")){const g=await store.get(k);if(g!=null)v[k.slice(4)]=g==="1";}
      const mg=parseInt(await store.get("meta")); if(!isNaN(mg)&&mg>0)setMeta(mg);
      const sg=parseInt(await store.get("sueldo")); if(!isNaN(sg)&&sg>0)setSueldo(sg);
      const fc={}; for(const k of await store.list("fijo:")){const g=await store.get(k);if(g==="1")fc[k.slice(5)]=true;}
      setFijoChk(fc);
    }catch(e){}
    vacStored.current=v;
    setOvr(o); setVacKeys(new Set(Object.keys(v))); setReady(true);
  })()},[]);

  // fuente remota de datos (si está configurada); ante error se mantienen los embebidos
  useEffect(()=>{ if(!REMOTE_URL) return; (async()=>{
    try{
      const r=await fetch(REMOTE_URL+(REMOTE_URL.includes("?")?"&":"?")+"k="+encodeURIComponent(token)+"&vista=todo&t="+Date.now());
      const j0=await r.json();
      const j=Array.isArray(j0)?j0:(j0&&Array.isArray(j0.datos)?j0.datos.map(t=>t.cat_orig?{...t,cat:t.cat_orig}:t):j0);
      const aj=j0&&j0.ajustes;
      if(aj){
        if(aj.cat) setOvr(p=>({...p,...aj.cat}));
        if(aj.vac){ vacStored.current={...vacStored.current,...aj.vac}; setVac(p=>p?{...p,...aj.vac}:p); setVacKeys(p=>{const n=new Set(p);Object.keys(aj.vac).forEach(k=>n.add(k));return n;}); }
        if(aj.fijo) setFijoChk(p=>({...p,...aj.fijo}));
        if(aj.meta>0) setMeta(aj.meta);
        if(aj.sueldo>0) setSueldo(aj.sueldo);
      }
      if(Array.isArray(j)&&j.length&&j[0].id&&j[0].fecha){ setRows0(j); setFuente("remota · "+new Date().toTimeString().slice(0,5)); setNeedKey(false);
        let cola=[]; try{ cola=JSON.parse(localStorage.getItem("fin_cola")||"[]"); }catch(e){}
        if(cola.length) pushCambio([]); }
      else if(j&&j.error){ setFuente("sin acceso (token)"); setNeedKey(true); }
      else setFuente("embebida (respuesta remota inválida)");
    }catch(e){ setFuente("embebida (remota no disponible)"); }
  })();},[token]);

  // lista de gastos fijos desde Google Sheet publicada (si está configurada)
  useEffect(()=>{ if(!FIJOS_CSV_URL) return; (async()=>{
    try{
      const r=await fetch(FIJOS_CSV_URL+(FIJOS_CSV_URL.includes("?")?"&":"?")+"t="+Date.now());
      const arr=parseFijosCSV(await r.text());
      if(arr.length){ setFijos(arr); setFuenteFijos("Google Sheet"); }
      else setFuenteFijos("lista embebida (sheet vacía)");
    }catch(e){ setFuenteFijos("lista embebida (sheet no disponible)"); }
  })();},[]);

  // vacaciones: override guardado > heurística; se recalcula si llegan filas nuevas
  useEffect(()=>{ if(!ready) return;
    setVac(p=>{const np={...(p||{})}; rows0.forEach(t=>{ if(!(t.id in np)) np[t.id]=(t.id in vacStored.current)?vacStored.current[t.id]:heurVac(t); }); return np;});
  },[rows0,ready]);

  const txById=id=>rows0.find(t=>t.id===id);
  const setCat=(id,c)=>{ setOvr(p=>({...p,[id]:c})); store.set("cat:"+id,c); pushCambio([{tipo:"cat",id,valor:c}]); const t=txById(id); logCambio("Categoría: "+(t?t.comercio:id)+" → "+c); };
  const toggleVac=(id)=>{ const nv=!(vac&&vac[id]); setVac(p=>({...p,[id]:nv})); store.set("vac:"+id,nv?"1":"0"); setVacKeys(p=>new Set(p).add(id)); pushCambio([{tipo:"vac",id,valor:nv}]); const t=txById(id); logCambio((nv?"Marcado como viaje: ":"Quitado de viajes: ")+(t?t.comercio:id)); };
  const saveMeta=(x)=>{ setMeta(x); store.set("meta",String(x)); clearTimeout(metaT.current); metaT.current=setTimeout(()=>{pushCambio([{tipo:"meta",valor:x}]); logCambio("Meta de compras directas: "+clp(x));},1500); };
  const saveSueldo=(x)=>{ setSueldo(x); store.set("sueldo",String(x)); clearTimeout(sueldoT.current); sueldoT.current=setTimeout(()=>{pushCambio([{tipo:"sueldo",valor:x}]); logCambio("Sueldo: "+clp(x));},1500); };
  const exportOvr=async()=>{
    const v={}; vacKeys.forEach(id=>{ if(vac&&(id in vac)) v[id]=vac[id]; });
    const payload=JSON.stringify({meta,cat:ovr,vac:v},null,1);
    try{ await navigator.clipboard.writeText(payload); setSync("cambios copiados al portapapeles"); }
    catch(e){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([payload],{type:"application/json"})); a.download="overrides_finanzas.json"; a.click(); }
  };
  const catOf=t=>ovr[t.id]||t.cat;
  // ¿gasto fijo? por categoría fija o por patrón de la lista maestra de fijos
  const esFijoTx=t=>FIJO.has(catOf(t))||fijos.some(f=>f.activo&&t.comercio.toLowerCase().includes((f.patron||f.nombre).toLowerCase()));
  // Buckets: "cons" = compras directas del ciclo (sin cuotas ni fijos);
  // "cuota" = toda cuota facturada, incluso 1/N; "fijo" = fijos del ciclo (categoría o patrón); "vac" = viajes (aparte)
  const bucketOf=t=>{ if(!vac) return "fijo"; if(vac[t.id]) return "vac"; if(t.cuota) return "cuota"; return esFijoTx(t)?"fijo":"cons"; };

  const m=useMemo(()=>{
    if(!vac) return null;
    const inC=t=>cycleTx(t)===ciclo;
    const out=rows0.filter(t=>t.flow==="out"&&!t.excl&&inC(t));
    const sum=b=>out.filter(t=>bucketOf(t)===b).reduce((a,t)=>a+t.monto,0);
    const cons=sum("cons"), fijo=sum("fijo"), cuota=sum("cuota"), vacb=sum("vac");
    const reembVac=rows0.filter(t=>inC(t)&&catOf(t)==="Reembolso recibido"&&REEMB_VAC_IDS.has(t.id)).reduce((a,t)=>a+t.monto,0);
    const reembCons=rows0.filter(t=>inC(t)&&catOf(t)==="Reembolso recibido"&&!REEMB_VAC_IDS.has(t.id)).reduce((a,t)=>a+t.monto,0);
    const consN=cons-reembCons, vacN=vacb-reembVac;
    const byCat={};
    out.forEach(t=>{const b=bucketOf(t); if(b==="vac") return;
      const c=b==="cuota"?"Cuotas mes":b==="fijo"?"Gastos fijos mes":catOf(t);
      byCat[c]=(byCat[c]||0)+t.monto;});
    Object.entries(REEMB_CAT).forEach(([id,c])=>{const t=rows0.find(x=>x.id===id);if(t&&inC(t))byCat[c]=(byCat[c]||0)-t.monto;});
    const cats=Object.entries(byCat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    let donut=cats.slice(0,8); const rest=cats.slice(8).reduce((a,[,v])=>a+v,0);
    if(rest>0) donut=[...donut,["Otros agrupados",rest]];
    const gastBank=k=>BANKS[k].accts.reduce((a,acc)=>a+out.filter(t=>t.cuenta===acc).reduce((s,t)=>s+t.monto,0),0);
    const cuoMap={};
    rows0.filter(t=>t.cuota&&Number(t.cuota.de)>1).forEach(t=>{const k=planKey(t),p=cuoMap[k];
      if(!p){cuoMap[k]=t;return;} const d=cycleDiff(cycleTx(t),cycleTx(p));
      if(d>0||(d===0&&t.cuota.n>p.cuota.n)) cuoMap[k]=t;});
    const cuotas=Object.values(cuoMap).sort((a,b)=>b.cuota.pendiente-a.cuota.pendiente);
    const met=rows0.find(t=>inC(t)&&METLIFE_RE.test(t.comercio)); const metX=met?Math.round(met.monto*0.5):0;
    const cuotaEsp=out.filter(t=>bucketOf(t)==="cuota"&&esEsp(t)).reduce((a,t)=>a+t.monto,0);
    const viajes=[...new Set(out.filter(t=>bucketOf(t)==="vac"&&t.viaje).map(t=>t.viaje))];
    return {consN,fijo,cuota,cuotaEsp,vacN,viajes,donut,gastSTG:gastBank("STG"),gastCHL:gastBank("CHL"),cuotas,metX};
  },[ovr,vac,ciclo,rows0,fijos]);

  // totales de un ciclo cualquiera (para las tarjetas vecinas del carrusel)
  const totCicloTx=c=>{
    const out=rows0.filter(t=>t.flow==="out"&&!t.excl&&cycleTx(t)===c);
    let tot=0,exc=0; out.forEach(t=>{const b=bucketOf(t); tot+=t.monto; if(b==="vac"||(b==="cuota"&&esEsp(t))) exc+=t.monto;});
    return {tot,exc};
  };

  const rows=useMemo(()=>rows0.filter(t=>{
    if(cycleTx(t)!==ciclo) return false;
    if(fTipo!=="todo"&&(t.flow!=="out"||t.excl||bucketOf(t)!==fTipo)) return false;
    if(!showExcl&&t.excl) return false;
    if(fAcc!=="todas"&&t.cuenta!==fAcc) return false;
    if(fCat!=="todas"&&catOf(t)!==fCat) return false;
    if(q&&!(t.comercio.toLowerCase().includes(q.toLowerCase())||(t.ciudad||"").toLowerCase().includes(q.toLowerCase()))) return false;
    return true;
  }).sort((a,b)=>a.fecha<b.fecha?1:-1),[ovr,fAcc,fCat,q,showExcl,ciclo,rows0,fTipo,fijos,vac]);

  // tripwire de duplicados: misma fecha+cuenta+monto+flow con id distinto
  const dupCands=useMemo(()=>{const seen={};let n=0;rows0.forEach(t=>{const k=t.fecha+"|"+t.cuenta+"|"+t.monto+"|"+t.flow;if(seen[k])n++;else seen[k]=1;});return n;},[rows0]);

  const ciclosL=useMemo(()=>[...new Set(rows0.map(t=>cycleTx(t)))].sort().reverse(),[rows0]);
  useEffect(()=>{ if(ciclosL.length&&!ciclosL.includes(ciclo)) setCiclo(ciclosL.includes(CICLO_HOY)?CICLO_HOY:ciclosL[0]); },[ciclosL]);
  useEffect(()=>{ setNVer(12); },[ciclo,fTipo,q,fAcc,fCat]);

  const toggleFijo=(nombre)=>{ const key=ciclo+"|"+nombre;
    const nv=!fijoChk[key]; setFijoChk(p=>({...p,[key]:nv})); store.set("fijo:"+key,nv?"1":"0"); pushCambio([{tipo:"fijo",id:key,valor:nv}]); logCambio("Fijo "+nombre+(nv?" marcado pagado":" desmarcado")+" ("+mesNom(ciclo)+")"); };
  const fijosView=useMemo(()=>{
    const used=new Set();
    return fijos.filter(f=>f.activo).map(f=>{
      const pat=(f.patron||f.nombre).toLowerCase();
      const tx=rows0.filter(t=>cycleTx(t)===ciclo&&t.flow==="out"&&!t.excl&&!used.has(t.id)&&t.comercio.toLowerCase().includes(pat))
        .sort((a,b)=>Math.abs(a.monto-f.monto)-Math.abs(b.monto-f.monto))[0];
      if(tx) used.add(tx.id);
      const manual=!!fijoChk[ciclo+"|"+f.nombre];
      const pagado=!!tx||manual;
      const fEsp=fechaEsp(ciclo,f.dia);
      const atrasado=!pagado&&ciclo===CICLO_HOY&&fEsp<HOY;
      return {...f,tx,manual,pagado,atrasado,fEsp,montoReal:tx?tx.monto:f.monto};
    }).sort((a,b)=>a.fEsp<b.fEsp?-1:1);
  },[fijos,rows0,ciclo,fijoChk]);

  // cuotas proyectadas: avanza n desde el último estado conciliado hasta el ciclo actual
  const cuotasView=useMemo(()=>{

    const items=m.cuotas.map(t=>{

      const elapsed=Math.max(0,cycleDiff(CICLO_HOY,base));
      // n=0 ("00/N" en el estado): la primera cuota se factura en el ciclo de la fila
      const nRaw=(t.cuota.n>0?t.cuota.n:1)+elapsed;
      const restIncl=Math.max(0,t.cuota.de-nRaw+1);
      const nAct=Math.min(nRaw,t.cuota.de);
      const pend=restIncl*t.cuota.valor;
      // fila futura (1ª cuota en un ciclo posterior, ej. Entel): aún no comienza
      const futura=cycleDiff(base,CICLO_HOY)>0;
      const ultimo=futura?cycleAdd(base,t.cuota.de-1):(restIncl>0?cycleAdd(CICLO_HOY,restIncl-1):null);
      return {...t,nAct,restIncl,pend,ultimo,estimado:elapsed>0,activa:restIncl>0,esp:esEsp(t),futura};
    }).sort((a,b)=>(a.activa===b.activa)?(a.pend<b.pend?1:-1):(a.activa?-1:1))
      .map(t=>({...t,color:t.esp?"#F2B544":(t.activa?QPAL[(qi++)%QPAL.length]:"#C9CDD6")}));
    const maxRest=items.reduce((a,t)=>Math.max(a,t.restIncl+(t.futura?cycleDiff(t.ciclo||cycleOf(t.fecha),CICLO_HOY):0)),0);
    const proy=[]; for(let k=0;k<maxRest;k++){
      const ck=cycleAdd(CICLO_HOY,k);
      const act=items.filter(t=>{ if(!t.activa) return false; if(t.futura){ const b=t.ciclo||cycleOf(t.fecha); const d=cycleDiff(ck,b); return d>=0&&d<t.cuota.de; } return t.restIncl>k; });
      proy.push({c:ck,monto:act.reduce((a,t)=>a+t.cuota.valor,0),espM:act.filter(t=>t.esp).reduce((a,t)=>a+t.cuota.valor,0),act});
    }
    const totPend=items.reduce((a,t)=>a+t.pend,0), totPendEsp=items.filter(t=>t.esp).reduce((a,t)=>a+t.pend,0);
    return {items,proy,totPend,totPendEsp,carga:proy.length?proy[0].monto:0,cargaEsp:proy.length?proy[0].espM:0,fin:proy.length?proy[proy.length-1].c:null};

  const fijoProj=ciclo===CICLO_HOY?totEsp+Math.max(0,m.fijo-fijoMatched):m.fijo;
  const dproj=cycleDiff(ciclo,CICLO_HOY);

  const totProj=Math.round(m.consN*dTot/dTr)+fijoProj+cuotaProj;
  const delta=sueldo-(totProj-cuotaEspProj);

  const otecTx=rows0.find(t=>cycleTx(t)===ciclo&&t.cuota&&esEsp(t));

      {cuotaEspProj>0&&<div className="row" style={{minHeight:56}}><span className="tag t-exc">Excepcional</span><span className="nm" style={{flex:1,fontSize:15,fontWeight:600}}>{ESP_LBL}{otec?" · cuota "+otec.n+"/"+otec.de:""}</span><span className="amt">{clp(cuotaEspProj)}</span></div>}
      {m.vacN>0&&<div className="row tap" style={{minHeight:56}} onClick={()=>irA("vac")}><span className="tag t-exc">Excepcional</span><span className="nm" style={{flex:1,fontSize:15,fontWeight:600}}>{m.viajes.length?"Viaje "+m.viajes.join(", "):"Viajes"}</span><span className="amt">{clp(m.vacN)}</span></div>}

    {esHoy&&<div className="strip">
      <div><div className="k">Proyección al cierre · día {dTr} de {dTot}</div><div className="v">{clp(totProj)}</div></div>
      <div style={{textAlign:"right"}}><div className="k">vs sueldo{cuotaEspProj>0?" (sin "+ESP_LBL+")":""}</div><div className="v" style={{color:delta>=0?"var(--save)":"var(--warn)"}}>{delta>=0?"+":"−"}{clp(Math.abs(delta))}</div></div>
    </div>}

      </div>
      <div className="box" style={{padding:18,display:"flex",flexDirection:"column",gap:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}><span style={{fontSize:14,color:"var(--muted)"}}>Esperado del ciclo</span><span style={{fontSize:30,fontWeight:800,letterSpacing:"-.02em"}}>{clp(totEsp)}</span></div>
        <div className="seg3" style={{height:10}}>{cats.map(x=><i key={x.c} style={{width:(x.tot/T*100)+"%",background:x.color}}/>)}</div>
        <div className="lg">{cats.map(x=><span key={x.c}><span className="sq" style={{background:x.color}}/>{x.c} · {Math.round(x.tot/T*100)} %</span>)}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,borderTop:"1px solid var(--line)",paddingTop:12}}>
          <div><div style={{fontSize:12,color:"var(--muted)"}}>Pagado</div><div style={{fontSize:16,fontWeight:800,color:"var(--save)"}}>{clp(totPag)}</div></div>
          <div><div style={{fontSize:12,color:"var(--muted)"}}>Pendiente</div><div style={{fontSize:16,fontWeight:800,color:totPend>0?"var(--warn)":"var(--muted)"}}>{clp(totPend)}</div></div>
        </div>
      </div>
      {cats.map(x=>(<div key={x.c} style={{display:"flex",flexDirection:"column",gap:8}}>
        <div className="sec"><span style={{display:"flex",alignItems:"center",gap:8}}><span className="sq" style={{background:x.color}}/>{x.c}</span><span className="r" style={{fontWeight:800,color:"var(--ink)"}}>{clp(x.tot)}</span></div>
        <div className="list">{x.l.map(f=>(<div key={f.nombre} className="row">
          <button className={"chk"+(f.pagado?" on":"")} disabled={!!f.tx} aria-pressed={f.pagado} aria-label={(f.pagado?"Pagado: ":"Marcar pagado: ")+f.nombre} onClick={()=>toggleFijo(f.nombre)}>{f.pagado&&Ico.check}</button>
          <div className="mid"><span className="nm">{f.nombre}</span>
            <span className="sub">{f.tx?"Pagado el "+fdate(f.tx.fecha):(f.manual?"Marcado a mano":(f.atrasado?<span className="tag t-warn">Atrasado · se esperaba el {fdate(f.fEsp)}</span>:"Esperado el "+fdate(f.fEsp)))}{f.cuenta&&ACC[f.cuenta]?" · "+ACC[f.cuenta].s:""}</span></div>
          <div style={{textAlign:"right"}}><div className="amt" style={{color:f.pagado?"var(--save)":"var(--ink)"}}>{clp(f.montoReal)}</div>
            {f.tx&&f.tx.monto!==f.monto&&<div style={{fontSize:11,color:"var(--muted)"}}>esperado {clp(f.monto)}</div>}</div>
        </div>))}</div>
      </div>))}
      <div style={{fontSize:12,color:"var(--muted)",lineHeight:1.55,padding:"0 4px"}}>El ✓ es automático cuando llega el cargo del ciclo. Usa el círculo para pagos hechos por fuera. La lista se edita en tu Google Sheet ({fuenteFijos}).</div>
      </>);})()}

    {tab==="mas" && <>
      <div style={{display:"flex",flexDirection:"column",gap:2}}>
        <span style={{fontSize:13,color:"var(--muted)"}}>Todo cambio queda registrado</span>
        <h1 className="h1">Más</h1>
      </div>

      <div className="sec"><span>Metas</span></div>
      <div className="list">
        <div className="row"><div className="mid"><span className="nm">Meta de compras directas</span><span className="sub">{restante>=0?"Sobran "+clp(restante):clp(-restante)+" sobre la meta"} · a ahorro {clp(ahorroBase)}</span></div>
          <input className="inp" style={{width:130,textAlign:"right"}} aria-label="Meta de compras directas" type="number" inputMode="numeric" step="50000" value={meta} onChange={e=>saveMeta(Math.max(0,parseInt(e.target.value||"0")))}/></div>
        <div className="row"><div className="mid"><span className="nm">Sueldo</span><span className="sub">Base de la proyección al cierre</span></div>
          <input className="inp" style={{width:130,textAlign:"right"}} aria-label="Sueldo" type="number" inputMode="numeric" step="10000" value={sueldo} onChange={e=>saveSueldo(Math.max(0,parseInt(e.target.value||"0")))}/></div>
      </div>

      <div className="sec"><span>Excepcionales</span></div>
      <div className="list">
        <div className="row"><div className="mid"><span className="nm">{ESP_LBL} UATSA</span><span className="sub">Cuota que pagas aparte: va entre paréntesis en el balance</span></div><span className="tag t-exc">Siempre</span></div>
        <div className="row"><div className="mid"><span className="nm">Viajes del ciclo</span><span className="sub">{m.viajes.length?m.viajes.join(", "):"Ninguno"} · para agregar uno, indícale a Claude nombre y fechas</span></div><span className="amt">{clp(m.vacN)}</span></div>
      </div>

      <div className="sec"><span>Análisis del ciclo</span><span className="r">{mesNom(ciclo)}</span></div>
      <div className="box" style={{padding:16,display:"flex",gap:14,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{width:150,height:150,position:"relative",flex:"none"}}>
          <ResponsiveContainer width="100%" height="100%"><PieChart>
            <Pie data={m.donut.map(([n,v])=>({name:n,value:v}))} dataKey="value" cx="50%" cy="50%" innerRadius={48} outerRadius={72} stroke="none" paddingAngle={1}>
              {m.donut.map(([n],i)=><Cell key={i} fill={n==="Cuotas mes"?"#7FB0FF":n==="Gastos fijos mes"?"#C3CBDB":PAL[i%PAL.length]}/>)}
            </Pie></PieChart></ResponsiveContainer>
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
            <span style={{fontSize:11,color:"var(--muted)"}}>total</span><span style={{fontWeight:800,fontSize:13}}>{clp(totalDona)}</span></div>
        </div>
        <div style={{flex:"1 1 160px",display:"flex",flexDirection:"column",gap:6}}>
          {m.donut.map(([n,v],i)=>(<div key={n} style={{display:"flex",alignItems:"center",gap:8,fontSize:12}}>
            <span className="sq" style={{background:n==="Cuotas mes"?"#7FB0FF":n==="Gastos fijos mes"?"#C3CBDB":PAL[i%PAL.length]}}/><span style={{flex:1}}>{n}</span>
            <b>{clp(v)}</b><span style={{width:34,textAlign:"right",color:"var(--muted)"}}>{Math.round(v/Math.max(1,totalDona)*100)}%</span></div>))}
        </div>
      </div>
      <div className="list">
        {Object.entries(BANKS).map(([k,b])=>{const gast=k==="STG"?m.gastSTG:m.gastCHL;const bi=info?(k==="STG"?info.stg:info.bdc):null;return(
          <div key={k} className="row"><span className="sq" style={{background:b.color}}/><div className="mid"><span className="nm">{b.label}</span>
            <span className="sub">{bi?"A pagar "+clp(bi.pagar)+(bi.intl?" + "+usd(bi.intl):"")+" · vence "+bi.vence:"Sin estado de cuenta del ciclo"}</span></div>
            <div style={{textAlign:"right"}}><div style={{fontSize:11,color:"var(--muted)"}}>Gastado</div><div className="amt">{clp(gast)}</div></div></div>);})}
        <div className="row"><div className="mid"><span className="nm">Ahorro extra · 50 % MetLife</span><span className="sub">No lo cuentas, pero acumula</span></div><span className="amt">{clp(m.metX)}</span></div>
        <div className="row"><div className="mid"><span className="nm">Fondo a invertir</span><span className="sub">No disponible para gasto</span></div><span className="amt">{clp(RESERVA_CHL)}</span></div>
      </div>

      <div className="sec"><span>Historial mensual</span></div>
      <div className="box" style={{padding:16}}>
        <div style={{width:"100%",height:200}}>
          <ResponsiveContainer><BarChart data={MESES.map(x=>({mes:x.mes,"Banco de Chile":x.bdcTC,"Santander":x.stgTC}))} margin={{top:6,right:4,left:0,bottom:0}}>
            <CartesianGrid strokeDasharray="3 3" stroke="#EEF1F7" vertical={false}/>
            <XAxis dataKey="mes" tick={{fontSize:12,fill:"#5B6170"}} axisLine={false} tickLine={false}/>
            <YAxis tickFormatter={clpK} tick={{fontSize:11,fill:"#5B6170"}} axisLine={false} tickLine={false} width={46}/>
            <Tooltip formatter={v=>clp(v)} labelStyle={{fontWeight:700}}/>
            <Legend wrapperStyle={{fontSize:12}}/>
            <Bar dataKey="Banco de Chile" stackId="a" fill="#1F4FBF"/>
            <Bar dataKey="Santander" stackId="a" fill="#7FB0FF" radius={[4,4,0,0]}/>
          </BarChart></ResponsiveContainer>
        </div>
        <div style={{overflow:"auto",marginTop:10}}>
          <table className="mt"><thead><tr><th>Mes 2026</th><th>TC BdC</th><th>TC Stg</th><th>Total TC</th><th>Ahorro</th><th>Extra MetLife</th></tr></thead><tbody>
            {MESES.map(x=>(<tr key={x.mes}><td style={{fontWeight:700}}>{x.mes}</td><td>{clp(x.bdcTC)}</td><td>{clp(x.stgTC)}</td><td style={{fontWeight:700}}>{clp(x.bdcTC+x.stgTC)}</td><td>{x.ahorro?clp(x.ahorro):"—"}</td><td>{clp(x.ahorroX)}</td></tr>))}
          </tbody></table>
        </div>
      </div>

      <div className="sec"><span>Datos</span></div>
      <div className="list">
        <div className="row"><div className="mid"><span className="nm">Fuente</span><span className="sub">{fuente}{sync?" · "+sync:""}</span></div></div>
        <div className="row"><div className="mid"><span className="nm">Datos al</span><span className="sub">{fdate(dataMax)} · build {BUILD}</span></div></div>
        <div className="row"><div className="mid"><span className="nm">Token del Apps Script</span><span className="sub">{token?"Guardado en este equipo":"Sin token"}</span></div>
          <button className="btn sec2" style={{padding:"8px 12px",fontSize:13}} onClick={()=>setNeedKey(true)}>Cambiar</button></div>
        <div className="row"><div className="mid"><span className="nm">Exportar cambios</span><span className="sub">Categorías y viajes editados, en JSON</span></div>
          <button className="btn sec2" style={{padding:"8px 12px",fontSize:13}} onClick={exportOvr}>Copiar</button></div>
      </div>

      <div className="sec"><span>Registro de cambios</span><span className="r">en este equipo</span></div>
      <div className="list">
        {log.length===0&&<div className="row"><span className="sub" style={{fontSize:13,color:"var(--muted)"}}>Aún no hay cambios hechos desde la app.</span></div>}
        {log.slice(0,30).map((e,i)=>(<div key={i} className="row" style={{minHeight:52}}><div className="mid"><span className="nm" style={{fontSize:14,whiteSpace:"normal"}}>{e.desc}</span></div>
          <span style={{fontSize:12,color:"var(--muted)",whiteSpace:"nowrap"}}>{fdate(e.ts.slice(0,10))} {new Date(e.ts).toTimeString().slice(0,5)}</span></div>))}
      </div>
    </>}
   </div>

   {selTx&&<div className="scrim" onClick={()=>setSel(null)}>
    <div className="sheet" role="dialog" aria-modal="true" aria-label={"Movimiento "+selTx.comercio} onClick={e=>e.stopPropagation()}>
      <div className="grab"/>
      <div style={{display:"flex",flexDirection:"column",gap:4}}>
        <span style={{fontSize:13,color:"var(--muted)"}}>{diaLbl(selTx.fecha)} · {ACC[selTx.cuenta]?ACC[selTx.cuenta].s:selTx.cuenta}{selTx.ciudad?" · "+selTx.ciudad:""}</span>
        <span style={{fontSize:20,fontWeight:800}}>{selTx.comercio}</span>
        <span style={{fontSize:30,fontWeight:800,letterSpacing:"-.02em"}}>{clp(selTx.monto)}{selTx.moneda==="USD-bill"&&<span style={{fontSize:14,color:"var(--muted)",fontWeight:600}}> · {usd(selTx.monto_orig)}</span>}</span>
        {selTx.cuota&&<span className={"tag "+(esEsp(selTx)?"t-exc":"t-cuo")} style={{alignSelf:"flex-start"}}>Cuota {selTx.cuota.n}/{selTx.cuota.de} de {clp(selTx.cuota.valor)}</span>}
      </div>
      <label style={{display:"flex",flexDirection:"column",gap:6,fontSize:13,color:"var(--muted2)",fontWeight:700}}>Categoría
        <select className="inp" value={catOf(selTx)} onChange={e=>setCat(selTx.id,e.target.value)}>{CATS.map(c=><option key={c} value={c}>{c}</option>)}</select></label>
      {selTx.flow==="out"&&!selTx.excl&&<button className={"btn"+(bucketOf(selTx)==="vac"?" sec2":"")} onClick={()=>toggleVac(selTx.id)}>{bucketOf(selTx)==="vac"?"Quitar de viajes":"Marcar como viaje (va aparte)"}</button>}
      <button className="btn ghost" onClick={()=>setSel(null)}>Cerrar</button>
    </div>
   </div>}

   <nav className="tabbar" aria-label="Secciones"><div className="in">
    {[["wallet","Wallet",Ico.wallet],["cuotas","Cuotas",Ico.cuotas],["fijos","Fijos",Ico.fijos],["mas","Más",Ico.mas]].map(([k,l,ic])=>
      <button key={k} className={tab===k?"on":""} aria-current={tab===k?"page":undefined} onClick={()=>{setTab(k); window.scrollTo(0,0);}}>{ic}{l}</button>)}
   </div></nav>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
<script>
// PWA: solo aplica si se sirve por HTTPS (en file:// se ignora sin error)
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
</script>
</body>
</html>
