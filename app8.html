const parseFijosCSV = txt => {
  const out=[];let row=[],cur="",q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(cur);cur="";}
    else if(c==='\n'||c==='\r'){ if(cur!==""||row.length){row.push(cur);out.push(row);row=[];cur="";} if(c==='\r'&&txt[i+1]==='\n')i++; }
    else cur+=c;
  }
  if(cur!==""||row.length){row.push(cur);out.push(row);}
  const [hdr,...body]=out; if(!hdr) return [];
  const H=hdr.map(h=>h.trim().toLowerCase());
  const g=(r,k)=>{const ix=H.indexOf(k);return ix>=0?(r[ix]||"").trim():"";};
  return body.filter(r=>g(r,"nombre")).map(r=>({
    nombre:g(r,"nombre"), categoria:g(r,"categoria")||"Otros",
    monto:Number(g(r,"monto").replace(/[^0-9\-]/g,""))||0,
    dia:Number(g(r,"dia"))||1, patron:(g(r,"patron")||g(r,"nombre")).toLowerCase(),
    activo:!["false","0","no"].includes(g(r,"activo").toLowerCase()),
  }));
};

const usd = n => "US$"+new Intl.NumberFormat("es-CL",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const fdate = s => { const [,m,d]=s.split("-"); return d+"/"+m; };

const useMobile = () => {
  const [mb,setMb]=useState(()=>window.matchMedia("(max-width:760px)").matches);
  useEffect(()=>{
    const mq=window.matchMedia("(max-width:760px)");
    const h=e=>setMb(e.matches);
    mq.addEventListener?mq.addEventListener("change",h):mq.addListener(h);
    return()=>{mq.removeEventListener?mq.removeEventListener("change",h):mq.removeListener(h);};
  },[]);
  return mb;
};

// Persistencia: window.storage (entorno Claude) con fallback a localStorage (navegador normal)
const store = {
  async get(k){ try{ if(window.storage){const g=await window.storage.get(k); return g?g.value:null;} }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){ return null; } },
  async set(k,v){ try{ if(window.storage){ await window.storage.set(k,v,false); return; } }catch(e){}
    try{ localStorage.setItem(k,v); }catch(e){} },
  async list(p){ try{ if(window.storage){const r=await window.storage.list(p); if(r&&r.keys) return r.keys;} }catch(e){}
    try{ return Object.keys(localStorage).filter(k=>k.startsWith(p)); }catch(e){ return []; } },
};

function App(){
  const [tab,setTab]=useState("periodo");
  const [ovr,setOvr]=useState({});
  const [vac,setVac]=useState(null);
  const [ready,setReady]=useState(false);
  const [meta,setMeta]=useState(700000);
  const [fAcc,setFAcc]=useState("todas");
  const [fCat,setFCat]=useState("todas");
  const [q,setQ]=useState("");
  const [showExcl,setShowExcl]=useState(false);
  const [ciclo,setCiclo]=useState(CICLOS.includes(CICLO_HOY)?CICLO_HOY:CICLOS[0]);
  const [vacKeys,setVacKeys]=useState(new Set());
  const [rows0,setRows0]=useState(DATA_C);
  const [fuente,setFuente]=useState(REMOTE_URL?"cargando remota…":"embebida");
  const [fijos,setFijos]=useState(FIJOS_DEF);
  const [fuenteFijos,setFuenteFijos]=useState(FIJOS_CSV_URL?"cargando…":"lista embebida");
  const [fijoChk,setFijoChk]=useState({});
  const vacStored=useRef({});
  const mobile=useMobile();

  useEffect(()=>{(async()=>{
    let o={}, v={};
    try{
      for(const k of await store.list("cat:")){const g=await store.get(k);if(g!=null)o[k.slice(4)]=g;}
      for(const k of await store.list("vac:")){const g=await store.get(k);if(g!=null)v[k.slice(4)]=g==="1";}
      const mg=parseInt(await store.get("meta")); if(!isNaN(mg)&&mg>0)setMeta(mg);
      const fc={}; for(const k of await store.list("fijo:")){const g=await store.get(k);if(g==="1")fc[k.slice(5)]=true;}
      setFijoChk(fc);
    }catch(e){}
    vacStored.current=v;
    setOvr(o); setVacKeys(new Set(Object.keys(v))); setReady(true);
  })()},[]);

  // fuente remota de datos (si está configurada); ante error se mantienen los embebidos
  useEffect(()=>{ if(!REMOTE_URL) return; (async()=>{
    try{
      const r=await fetch(REMOTE_URL+(REMOTE_URL.includes("?")?"&":"?")+"t="+Date.now());
      const j=await r.json();
      if(Array.isArray(j)&&j.length&&j[0].id&&j[0].fecha){ setRows0(j); setFuente("remota · "+new Date().toTimeString().slice(0,5)); }
      else setFuente("embebida (respuesta remota inválida)");
    }catch(e){ setFuente("embebida (remota no disponible)"); }
  })();},[]);

  // lista de gastos fijos desde Google Sheet publicada (si está configurada)
  useEffect(()=>{ if(!FIJOS_CSV_URL) return; (async()=>{
    try{
      const r=await fetch(FIJOS_CSV_URL+(FIJOS_CSV_URL.includes("?")?"&":"?")+"t="+Date.now());
      const arr=parseFijosCSV(await r.text());
      if(arr.length){ setFijos(arr); setFuenteFijos("Google Sheet"); }
      else setFuenteFijos("lista embebida (sheet vacía)");
    }catch(e){ setFuenteFijos("lista embebida (sheet no disponible)"); }
  })();},[]);

  // vacaciones: override guardado > heurística; se recalcula si llegan filas nuevas
  useEffect(()=>{ if(!ready) return;
    setVac(p=>{const np={...(p||{})}; rows0.forEach(t=>{ if(!(t.id in np)) np[t.id]=(t.id in vacStored.current)?vacStored.current[t.id]:heurVac(t); }); return np;});
  },[rows0,ready]);

  const setCat=(id,c)=>{ setOvr(p=>({...p,[id]:c})); store.set("cat:"+id,c); };
  const toggleVac=(id)=>{ setVac(p=>{const nv={...p,[id]:!p[id]}; store.set("vac:"+id,nv[id]?"1":"0"); return nv;}); setVacKeys(p=>new Set(p).add(id)); };
  const saveMeta=(x)=>{ setMeta(x); store.set("meta",String(x)); };
  const exportOvr=async()=>{
    const v={}; vacKeys.forEach(id=>{ if(vac&&(id in vac)) v[id]=vac[id]; });
    const payload=JSON.stringify({meta,cat:ovr,vac:v},null,1);
    try{ await navigator.clipboard.writeText(payload); alert("Cambios copiados al portapapeles: "+Object.keys(ovr).length+" categorías, "+Object.keys(v).length+" marcas de vacaciones."); }
    catch(e){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([payload],{type:"application/json"})); a.download="overrides_finanzas.json"; a.click(); }
  };
  const catOf=t=>ovr[t.id]||t.cat;
  const bucketOf=t=>{ if(!vac) return "fijo"; if(vac[t.id]) return "vac"; if(t.cuota) return "cuota"; return FIJO.has(catOf(t))?"fijo":"cons"; };

  const m=useMemo(()=>{
    if(!vac) return null;
    const inC=t=>cycleTx(t)===ciclo;
    const out=rows0.filter(t=>t.flow==="out"&&!t.excl&&inC(t));
    const sum=b=>out.filter(t=>bucketOf(t)===b).reduce((a,t)=>a+t.monto,0);
    const cons=sum("cons"), fijo=sum("fijo"), cuota=sum("cuota"), vacb=sum("vac");
    const reembVac=rows0.filter(t=>inC(t)&&catOf(t)==="Reembolso recibido"&&REEMB_VAC_IDS.has(t.id)).reduce((a,t)=>a+t.monto,0);
    const reembCons=rows0.filter(t=>inC(t)&&catOf(t)==="Reembolso recibido"&&!REEMB_VAC_IDS.has(t.id)).reduce((a,t)=>a+t.monto,0);
    const consN=cons-reembCons, vacN=vacb-reembVac;
    const byCat={};
    out.filter(t=>bucketOf(t)!=="vac").forEach(t=>{const c=catOf(t);byCat[c]=(byCat[c]||0)+t.monto;});
    Object.entries(REEMB_CAT).forEach(([id,c])=>{const t=rows0.find(x=>x.id===id);if(t&&inC(t))byCat[c]=(byCat[c]||0)-t.monto;});
    const cats=Object.entries(byCat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    let donut=cats.slice(0,8); const rest=cats.slice(8).reduce((a,[,v])=>a+v,0);
    if(rest>0) donut=[...donut,["Otros agrupados",rest]];
    const gastBank=k=>BANKS[k].accts.reduce((a,acc)=>a+out.filter(t=>t.cuenta===acc).reduce((s,t)=>s+t.monto,0),0);
    const cuoMap={};
    rows0.filter(t=>t.cuota).forEach(t=>{const k=t.comercio+"|"+t.cuota.total+"|"+t.cuota.de;if(!cuoMap[k]||t.cuota.n>cuoMap[k].cuota.n)cuoMap[k]=t;});
    const cuotas=Object.values(cuoMap).sort((a,b)=>b.cuota.pendiente-a.cuota.pendiente);
    const proxMes=cuotas.filter(t=>t.cuota.n<t.cuota.de).reduce((a,t)=>a+t.cuota.valor,0);
    const compromiso=cuotas.reduce((a,t)=>a+t.cuota.pendiente,0);
    const met=rows0.find(t=>inC(t)&&METLIFE_RE.test(t.comercio)); const metX=met?Math.round(met.monto*0.5):0;
    return {consN,fijo,cuota,vacN,donut,gastSTG:gastBank("STG"),gastCHL:gastBank("CHL"),cuotas,proxMes,compromiso,metX};
  },[ovr,vac,ciclo,rows0]);

  const rows=useMemo(()=>rows0.filter(t=>{
    if(cycleTx(t)!==ciclo) return false;
    if(!showExcl&&t.excl) return false;
    if(fAcc!=="todas"&&t.cuenta!==fAcc) return false;
    if(fCat!=="todas"&&catOf(t)!==fCat) return false;
    if(q&&!(t.comercio.toLowerCase().includes(q.toLowerCase())||(t.ciudad||"").toLowerCase().includes(q.toLowerCase()))) return false;
    return true;
  }).sort((a,b)=>a.fecha<b.fecha?1:-1),[ovr,fAcc,fCat,q,showExcl,ciclo,rows0]);

  const ciclosL=useMemo(()=>[...new Set(rows0.map(t=>cycleTx(t)))].sort().reverse(),[rows0]);
  useEffect(()=>{ if(ciclosL.length&&!ciclosL.includes(ciclo)) setCiclo(ciclosL.includes(CICLO_HOY)?CICLO_HOY:ciclosL[0]); },[ciclosL]);

  const toggleFijo=(nombre)=>{ const key=ciclo+"|"+nombre;
    setFijoChk(p=>{const np={...p,[key]:!p[key]}; store.set("fijo:"+key,np[key]?"1":"0"); return np;}); };
  const fijosView=useMemo(()=>fijos.filter(f=>f.activo).map(f=>{
    const pat=(f.patron||f.nombre).toLowerCase();
    const tx=rows0.find(t=>cycleTx(t)===ciclo&&t.flow==="out"&&!t.excl&&t.comercio.toLowerCase().includes(pat));
    const manual=!!fijoChk[ciclo+"|"+f.nombre];
    const pagado=!!tx||manual;
    const fEsp=fechaEsp(ciclo,f.dia);
    const atrasado=!pagado&&ciclo===CICLO_HOY&&fEsp<HOY;
    return {...f,tx,manual,pagado,atrasado,fEsp,montoReal:tx?tx.monto:f.monto};
  }).sort((a,b)=>a.fEsp<b.fEsp?-1:1),[fijos,rows0,ciclo,fijoChk]);

  // cuotas proyectadas: avanza n desde el último estado conciliado hasta el ciclo actual
  const cuotasView=useMemo(()=>{
    if(!m) return {items:[],proy:[],totPend:0,carga:0,fin:null};
    const items=m.cuotas.map(t=>{
      const base=t.ciclo||cycleOf(t.fecha);
      const elapsed=Math.max(0,cycleDiff(CICLO_HOY,base));
      const nRaw=t.cuota.n+elapsed;
      const restIncl=Math.max(0,t.cuota.de-nRaw+1);
      const nAct=Math.min(nRaw,t.cuota.de);
      const pend=restIncl*t.cuota.valor;
      const ultimo=restIncl>0?cycleAdd(CICLO_HOY,restIncl-1):null;
      return {...t,nAct,restIncl,pend,ultimo,estimado:elapsed>0,activa:restIncl>0};
    }).sort((a,b)=>(a.activa===b.activa)?(a.pend<b.pend?1:-1):(a.activa?-1:1));
    const maxRest=items.reduce((a,t)=>Math.max(a,t.restIncl),0);
    const proy=[]; for(let k=0;k<maxRest;k++){
      proy.push({c:cycleAdd(CICLO_HOY,k),monto:items.filter(t=>t.restIncl>k).reduce((a,t)=>a+t.cuota.valor,0)});
    }
    const totPend=items.reduce((a,t)=>a+t.pend,0);
    return {items,proy,totPend,carga:proy.length?proy[0].monto:0,fin:proy.length?proy[proy.length-1].c:null};
  },[m]);

  if(!ready||!m) return <div className="wrap" style={{padding:24}}>Cargando…</div>;
  const restante=meta-m.consN;
  const ahorroBase=Math.max(restante,0);
  const totBar=m.consN+m.fijo+m.cuota;
  const totalDona=m.donut.reduce((a,[,v])=>a+v,0);
  const BK={cons:{l:"Consumo",c:COL.cons},fijo:{l:"Fijo",c:COL.fijo},cuota:{l:"Cuota",c:COL.cuota},vac:{l:"✈ Vacaciones",c:"#E08A3C"}};
  const chartMeses=MESES.map(x=>({mes:x.mes,"Banco de Chile":x.bdcTC,"Santander":x.stgTC}));
  const chartAhorro=MESES.map(x=>({mes:x.mes,"Ahorro":x.ahorro,"Extra MetLife":x.ahorroX}));
  const totAhorro=MESES.reduce((a,x)=>a+x.ahorro,0), totAhorroX=MESES.reduce((a,x)=>a+x.ahorroX,0);
  const info=CICLO_INFO[ciclo];
  const gastTC=rows0.filter(t=>t.flow==="out"&&!t.excl&&cycleTx(t)===ciclo&&t.cuenta.includes("TC")).reduce((a,t)=>a+t.monto,0);
  const dataMax=rows0.reduce((a,t)=>t.fecha>a&&t.fecha<=HOY?t.fecha:a,"0000-00-00");
  const diasSin=Math.max(0,Math.round((new Date(HOY)-new Date(dataMax))/864e5));
  const totEsp=fijosView.reduce((a,f)=>a+f.monto,0);
  const totPag=fijosView.filter(f=>f.pagado).reduce((a,f)=>a+f.montoReal,0);
  const totPend=fijosView.filter(f=>!f.pagado).reduce((a,f)=>a+f.monto,0);

  return (<div className="wrap">
   <style>{CSS}</style>
   <div className="main">
    <div className="hdr">

    <div className="panel" style={{marginTop:13,padding:"14px 16px 4px"}}>

        <select className="filt" value={fCat} onChange={e=>setFCat(e.target.value)}><option value="todas">Todas las categorías</option>{CATS.map(c=><option key={c} value={c}>{c}</option>)}</select>

        <button className="btnx" onClick={exportOvr}>Exportar cambios</button>
      </div>
      {mobile ? (
      <div style={{overflow:"auto",maxHeight:520}}>

              <span className="num">{fdate(t.fecha)}</span>
              <span className="tag" style={{background:ACC[t.cuenta].c+"18",color:ACC[t.cuenta].c}}>{ACC[t.cuenta].s}</span>
              {t.cuota&&<span className="chip">cuota {t.cuota.n}/{t.cuota.de}</span>}
              <span className="amt num" style={{color:t.flow==="in"?"var(--save)":(t.excl?"#AEB3C0":"var(--ink)")}}>{t.flow==="in"?"+":"−"}{clp(t.monto)}</span>

            </div>
          </div>)})}
      </div>
      ) : (
      <div style={{overflow:"auto",maxHeight:500}}>
      <table><thead><tr><th>Fecha</th><th>Cuenta</th><th>Comercio</th><th>Categoría</th><th>Tipo</th><th className="rt">Monto</th></tr></thead>
        <tbody>
        {rows.map(t=>{const edited=ovr[t.id]&&ovr[t.id]!==t.cat;const bk=t.excl?null:bucketOf(t);return(
          <tr key={t.id} className={t.excl?"excl":(bk==="vac"?"vac":"")}>
            <td className="num">{fdate(t.fecha)}</td>
            <td><span className="tag" style={{background:ACC[t.cuenta].c+"18",color:ACC[t.cuenta].c}}>{ACC[t.cuenta].s}</span></td>

            <td className="rt num" style={{color:t.flow==="in"?"var(--save)":(t.excl?"#AEB3C0":"var(--ink)")}}>{t.flow==="in"?"+":"−"}{clp(t.monto)}{t.moneda==="USD-bill"&&<div className="chip num">{usd(t.monto_orig)}</div>}</td>
          </tr>)})}
        </tbody></table>
      </div>

    {tab==="fijos" && <>
    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",margin:"12px 0 0"}}>

      <div><div className="k">Pendiente</div><div className="num" style={{fontSize:19,fontWeight:700,color:totPend>0?"#E08A3C":"var(--muted)"}}>{clp(totPend)}</div></div>
    </div>
    <div className="panel" style={{marginTop:12,padding:"4px 14px"}}>
      {fijosView.map(f=>(
      <div key={f.nombre} className="fijorow">
        <input type="checkbox" checked={f.pagado} disabled={!!f.tx} onChange={()=>toggleFijo(f.nombre)}/>
        <div className="fi">
          <div className="nm">{f.nombre} <span className="chip">{f.categoria} · día {f.dia}</span></div>
          <div className="chip">{f.tx?("pagado el "+fdate(f.tx.fecha)+" — "+f.tx.comercio):(f.manual?"marcado manualmente":(f.atrasado?"⚠ atrasado — se esperaba el "+fdate(f.fEsp):"esperado el "+fdate(f.fEsp)))}</div>

        <div className="rt">
          <div className="num" style={{fontWeight:700,color:f.pagado?"var(--save)":(f.atrasado?"#E08A3C":"var(--ink)")}}>{clp(f.montoReal)}</div>
          {f.tx&&f.tx.monto!==f.monto&&<div className="chip num">esperado {clp(f.monto)}</div>}
        </div>
      </div>))}
    </div>
    <div className="chip" style={{marginTop:10,lineHeight:1.6}}>
      El ✓ es automático al detectar el cargo del ciclo (por patrón de comercio); usa el checkbox para pagos hechos por fuera.
      La lista maestra se edita en tu Google Sheet (columnas: nombre, categoria, monto, dia, patron, activo).
    </div>
    </>}

    {tab==="cuotas" && <>
    <div className="cuoSum" style={{marginTop:14}}>
      <div><div className="k">Compromiso pendiente</div><div className="num" style={{fontSize:19,fontWeight:700,color:COL.cuota}}>{clp(cuotasView.totPend)}</div></div>
      <div><div className="k">Carga mensual actual</div><div className="num" style={{fontSize:19,fontWeight:700}}>{clp(cuotasView.carga)}</div></div>
      <div><div className="k">Todo pagado en</div><div className="num" style={{fontSize:15,fontWeight:600,marginTop:4}}>{cuotasView.fin?mesNom(cuotasView.fin):"—"}</div></div>
    </div>
    <div className="panel" style={{marginTop:12,padding:"6px 14px"}}>
      {cuotasView.items.map(t=>(
      <div key={t.id} className="fijorow">
        <div className="fi">
          <div className="nm">{t.comercio} <span className="chip">cuota {t.nAct}/{t.cuota.de}{t.estimado?" (est.)":""}</span></div>
          <div className="bar" style={{margin:"6px 0 4px"}}><i style={{width:(t.nAct/t.cuota.de*100)+"%",background:t.activa?COL.cuota:"#C7CCD8"}}/></div>
          <div className="chip num">{clp(t.cuota.valor)}/mes · total {clp(t.cuota.total)}</div>
        </div>
        <div className="rt">
          {t.activa ? <>
            <div className="num" style={{fontWeight:700,color:COL.cuota}}>{clp(t.pend)}</div>
            <div className="chip">última: <b>{mesNom(t.ultimo)}</b></div>
          </> : <div className="chip" style={{color:"var(--save)",fontWeight:700}}>✓ pagada</div>}
        </div>
      </div>))}
    </div>
    <div className="panel" style={{marginTop:12,padding:"14px 16px"}}>
      <div className="sectitle">Proyección de carga por ciclo</div>

    {tab==="meses" && <>
    <div className="grid2" style={{marginTop:14}}>
      <div className="panel" style={{padding:"16px 18px"}}>
        <div className="sectitle">A pagar en tarjetas por mes</div>

          <ResponsiveContainer><BarChart data={chartMeses} margin={{top:6,right:8,left:0,bottom:0}}>

            <XAxis dataKey="mes" tick={{fontSize:12,fill:"#8A90A0"}} axisLine={false} tickLine={false}/>
            <YAxis tickFormatter={clpK} tick={{fontSize:11,fill:"#8A90A0"}} axisLine={false} tickLine={false} width={46}/>
            <Tooltip formatter={v=>clp(v)} labelStyle={{fontWeight:700}}/>
            <Legend wrapperStyle={{fontSize:12}}/>
            <Bar dataKey="Banco de Chile" stackId="a" fill="#3460E0"/>
            <Bar dataKey="Santander" stackId="a" fill="#EC1C3D" radius={[4,4,0,0]}/>
          </BarChart></ResponsiveContainer>
        </div>
      </div>
      <div className="panel" style={{padding:"16px 18px"}}>
        <div className="sectitle">Ahorro por mes</div>
        <div style={{width:"100%",height:240,marginTop:10}}>
          <ResponsiveContainer><BarChart data={chartAhorro} margin={{top:6,right:8,left:0,bottom:0}}>
            <CartesianGrid strokeDasharray="3 3" stroke="#EEF1F7" vertical={false}/>
            <XAxis dataKey="mes" tick={{fontSize:12,fill:"#8A90A0"}} axisLine={false} tickLine={false}/>
            <YAxis tickFormatter={clpK} tick={{fontSize:11,fill:"#8A90A0"}} axisLine={false} tickLine={false} width={46}/>
            <Tooltip formatter={v=>clp(v)} labelStyle={{fontWeight:700}}/>
            <Legend wrapperStyle={{fontSize:12}}/>
            <Bar dataKey="Ahorro" stackId="a" fill="#27B07A"/>
            <Bar dataKey="Extra MetLife" stackId="a" fill="#9BC85A" radius={[4,4,0,0]}/>
          </BarChart></ResponsiveContainer>
        </div>
        <div className="chip">Acumulado ene–may: ahorro explícito <b className="num">{clp(totAhorro)}</b> + extra MetLife <b className="num">{clp(totAhorroX)}</b>.</div>
      </div>
    </div>

    <div className="panel" style={{marginTop:13,padding:"14px 16px 6px",overflow:"auto"}}>
      <div className="sectitle" style={{marginBottom:6}}>Balances principales por mes</div>
      <table className="mtab"><thead><tr>
        <th>Mes 2026</th><th className="rt">TC BdC</th><th className="rt">TC Santander</th><th className="rt">Total tarjetas</th>
        <th className="rt">Saldo Stg CC</th><th className="rt">Saldo BdC CC</th>
        <th className="rt">Ahorro</th><th className="rt">Extra MetLife</th>
      </tr></thead><tbody>
        {MESES.map(x=>(<tr key={x.mes}>
          <td style={{fontWeight:600}}>{x.mes}</td>
          <td className="n">{clp(x.bdcTC)}{x.intl&&<span className="chip num"> +{usd(x.intl)}</span>}</td>
          <td className="n">{clp(x.stgTC)}</td>
          <td className="n" style={{fontWeight:700}}>{clp(x.bdcTC+x.stgTC)}</td>
          <td className="n">{x.sStg!=null?clp(x.sStg):"—"}</td>
          <td className="n">{clp(x.sChl)}</td>
          <td className="n" style={{color:x.ahorro?COL.save:"inherit",fontWeight:x.ahorro?600:400}}>{x.ahorro?clp(x.ahorro):"—"}</td>
          <td className="n" style={{color:"#5E8A2E"}}>{clp(x.ahorroX)}</td>
        </tr>))}
      </tbody></table>
    </div>
    <div className="chip" style={{marginTop:12,lineHeight:1.6}}>
      Series desde los estados facturados (TC) y las cartolas (cuentas corrientes) de cada mes, conciliadas con sus totales de control.
      "Ahorro" son traspasos explícitos a cuenta de ahorro / fondo mutuo; "Extra MetLife" es el 50% del seguro que también acumula.
      Mayo es atípico por el viaje (financiado con ahorro). El saldo de BdC (~$22M) es el fondo a invertir y no se toca.
    </div>
    </>}

   </div>
  </div>);
}

<script>
// PWA: solo aplica si se sirve por HTTPS (en file:// se ignora sin error)
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
