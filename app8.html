(function(){
  function show(msg){var s=document.getElementById("splash"); if(s) s.textContent="⚠ "+msg;}
  window.addEventListener("error",function(ev){
    if(ev.target&&ev.target.src){ show("No cargó: "+ev.target.src.split("/").pop()); return; }
    show("Error: "+(ev.message||"desconocido")+(ev.lineno?" (línea "+ev.lineno+")":""));
  },true);
  window.addEventListener("unhandledrejection",function(ev){
    show("Error (promesa): "+((ev.reason&&ev.reason.message)||ev.reason));
  });
  setTimeout(function(){
    var faltan=["React","ReactDOM","Recharts","Babel"].filter(function(n){return !window[n];});

  },8000);
})();

const parseFijosCSV = txt => {
  const out=[];let row=[],cur="",q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(cur);cur="";}
    else if(c==='\n'||c==='\r'){ if(cur!==""||row.length){row.push(cur);out.push(row);row=[];cur="";} if(c==='\r'&&txt[i+1]==='\n')i++; }
    else cur+=c;
  }
  if(cur!==""||row.length){row.push(cur);out.push(row);}
  const [hdr,...body]=out; if(!hdr) return [];
  const H=hdr.map(h=>h.trim().toLowerCase());
  const g=(r,k)=>{const ix=H.indexOf(k);return ix>=0?(r[ix]||"").trim():"";};
  return body.filter(r=>g(r,"nombre")).map(r=>({
    nombre:g(r,"nombre"), categoria:g(r,"categoria")||"Otros",
    monto:Number(g(r,"monto").replace(/[^0-9\-]/g,""))||0,
    dia:Number(g(r,"dia"))||1, patron:(g(r,"patron")||g(r,"nombre")).toLowerCase(),
    activo:!["false","0","no"].includes(g(r,"activo").toLowerCase()),
    // columna "cuenta" (o "tarjeta") de la sheet; si no existe, hereda de la lista embebida por nombre
    cuenta:accNorm(g(r,"cuenta")||g(r,"tarjeta"))||((FIJOS_DEF.find(d=>d.nombre.toLowerCase()===g(r,"nombre").trim().toLowerCase())||{}).cuenta||""),
  }));
};

const useMobile = () => {

  useEffect(()=>{

    const h=e=>setMb(e.matches);

// Persistencia: window.storage (entorno Claude) con fallback a localStorage (navegador normal)
const store = {
  async get(k){ try{ if(window.storage){const g=await window.storage.get(k); return g?g.value:null;} }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){ return null; } },
  async set(k,v){ try{ if(window.storage){ await window.storage.set(k,v,false); return; } }catch(e){}
    try{ localStorage.setItem(k,v); }catch(e){} },
  async list(p){ try{ if(window.storage){const r=await window.storage.list(p); if(r&&r.keys) return r.keys;} }catch(e){}
    try{ return Object.keys(localStorage).filter(k=>k.startsWith(p)); }catch(e){ return []; } },
};

.btnx{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;color:var(--accent);cursor:pointer;}
.fijorow{display:flex;gap:11px;align-items:center;padding:10px 2px;border-bottom:1px solid #F1F3F8;}
.fijorow:last-child{border-bottom:0;}
.fijorow .fi{flex:1;min-width:0;}
.fijorow .nm{font-size:13.5px;font-weight:600;}
.fijorow input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:#27B07A;}
.txcard{padding:11px 4px;border-bottom:1px solid #F1F3F8;}
.txcard.excl{opacity:.6;}
.txcard.vac{background:#FFF7F2;}
.txcard .r1{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;}
.txcard .amt{margin-left:auto;font-size:14.5px;font-weight:700;}
.txcard .mer{font-size:13.5px;margin-top:4px;color:var(--ink);}
.txcard .r3{display:flex;gap:8px;align-items:center;margin-top:8px;}

 .main{padding:14px 12px 40px;}
 .h1{font-size:20px;}
 .reserva{width:100%;}
 .tabs{display:flex;width:100%;}
 .tabs button{flex:1;padding:10px 6px;}
 .grid2{grid-template-columns:1fr;gap:11px;}
 .cardgrid{grid-template-columns:1fr 1fr;gap:9px;}
 .card{padding:12px 12px;}
 .card .big{font-size:18px;}
 .savecard{min-width:145px;padding:12px 13px;}
 .savecard .v{font-size:17px;}
 .bankcard .body{flex-direction:column;gap:9px;}
 .bankcard .col.rt{text-align:left;}
 .donutrow{flex-direction:column;}
 .donutrow .legend{width:100%;}
 .cuoSum{flex-wrap:wrap;gap:12px;}
 .filters .sectitle{flex:1 1 100%;margin-right:0!important;}
 .filters .search{flex:1 1 100%;min-width:0;}
 select.filt{flex:1;min-width:0;}
 .lg{gap:10px 14px;}
}
@media(max-width:380px){.cardgrid{grid-template-columns:1fr;}}
`;

function App(){
  const [tab,setTab]=useState("periodo");
  const [ovr,setOvr]=useState({});
  const [vac,setVac]=useState(null);
  const [ready,setReady]=useState(false);
  const [meta,setMeta]=useState(700000);
  const [sueldo,setSueldo]=useState(1870000);
  const [fAcc,setFAcc]=useState("todas");
  const [fCat,setFCat]=useState("todas");
  const [q,setQ]=useState("");
  const [showExcl,setShowExcl]=useState(false);
  const [ciclo,setCiclo]=useState(CICLOS.includes(CICLO_HOY)?CICLO_HOY:(CICLOS[0]||CICLO_HOY));
  const [vacKeys,setVacKeys]=useState(new Set());
  const [rows0,setRows0]=useState(DATA_C);
  const [fuente,setFuente]=useState(REMOTE_URL?"cargando remota…":"embebida");
  const [fijos,setFijos]=useState(FIJOS_DEF);
  const [fuenteFijos,setFuenteFijos]=useState(FIJOS_CSV_URL?"cargando…":"lista embebida");
  const [fijoChk,setFijoChk]=useState({});
  const [soloVar,setSoloVar]=useState(false);
  const vacStored=useRef({});
  const mobile=useMobile();

  useEffect(()=>{(async()=>{
    let o={}, v={};
    try{
      for(const k of await store.list("cat:")){const g=await store.get(k);if(g!=null)o[k.slice(4)]=g;}
      for(const k of await store.list("vac:")){const g=await store.get(k);if(g!=null)v[k.slice(4)]=g==="1";}
      const mg=parseInt(await store.get("meta")); if(!isNaN(mg)&&mg>0)setMeta(mg);
      const sg=parseInt(await store.get("sueldo")); if(!isNaN(sg)&&sg>0)setSueldo(sg);
      const fc={}; for(const k of await store.list("fijo:")){const g=await store.get(k);if(g==="1")fc[k.slice(5)]=true;}
      setFijoChk(fc);
    }catch(e){}
    vacStored.current=v;
    setOvr(o); setVacKeys(new Set(Object.keys(v))); setReady(true);
  })()},[]);

  // fuente remota de datos (si está configurada); ante error se mantienen los embebidos
  useEffect(()=>{ if(!REMOTE_URL) return; (async()=>{
    try{
      const r=await fetch(REMOTE_URL+(REMOTE_URL.includes("?")?"&":"?")+"t="+Date.now());
      const j=await r.json();
      if(Array.isArray(j)&&j.length&&j[0].id&&j[0].fecha){ setRows0(j); setFuente("remota · "+new Date().toTimeString().slice(0,5)); }
      else setFuente("embebida (respuesta remota inválida)");
    }catch(e){ setFuente("embebida (remota no disponible)"); }
  })();},[]);

  // lista de gastos fijos desde Google Sheet publicada (si está configurada)
  useEffect(()=>{ if(!FIJOS_CSV_URL) return; (async()=>{
    try{
      const r=await fetch(FIJOS_CSV_URL+(FIJOS_CSV_URL.includes("?")?"&":"?")+"t="+Date.now());
      const arr=parseFijosCSV(await r.text());
      if(arr.length){ setFijos(arr); setFuenteFijos("Google Sheet"); }
      else setFuenteFijos("lista embebida (sheet vacía)");
    }catch(e){ setFuenteFijos("lista embebida (sheet no disponible)"); }
  })();},[]);

  // vacaciones: override guardado > heurística; se recalcula si llegan filas nuevas
  useEffect(()=>{ if(!ready) return;
    setVac(p=>{const np={...(p||{})}; rows0.forEach(t=>{ if(!(t.id in np)) np[t.id]=(t.id in vacStored.current)?vacStored.current[t.id]:heurVac(t); }); return np;});
  },[rows0,ready]);

  const setCat=(id,c)=>{ setOvr(p=>({...p,[id]:c})); store.set("cat:"+id,c); };
  const toggleVac=(id)=>{ setVac(p=>{const nv={...p,[id]:!p[id]}; store.set("vac:"+id,nv[id]?"1":"0"); return nv;}); setVacKeys(p=>new Set(p).add(id)); };
  const saveMeta=(x)=>{ setMeta(x); store.set("meta",String(x)); };
  const saveSueldo=(x)=>{ setSueldo(x); store.set("sueldo",String(x)); };
  const exportOvr=async()=>{
    const v={}; vacKeys.forEach(id=>{ if(vac&&(id in vac)) v[id]=vac[id]; });
    const payload=JSON.stringify({meta,cat:ovr,vac:v},null,1);
    try{ await navigator.clipboard.writeText(payload); alert("Cambios copiados al portapapeles: "+Object.keys(ovr).length+" categorías, "+Object.keys(v).length+" marcas de vacaciones."); }
    catch(e){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([payload],{type:"application/json"})); a.download="overrides_finanzas.json"; a.click(); }
  };
  const catOf=t=>ovr[t.id]||t.cat;
  // ¿gasto fijo? por categoría fija o por patrón de la lista maestra de fijos
  const esFijoTx=t=>FIJO.has(catOf(t))||fijos.some(f=>f.activo&&t.comercio.toLowerCase().includes((f.patron||f.nombre).toLowerCase()));
  // Buckets: "cons" = compras particulares del ciclo (sin cuotas ni fijos);
  // "cuota" = toda cuota facturada, incluso 1/N (detalle en pestaña Cuotas); "fijo" = fijos del ciclo (categoría o patrón)
  const bucketOf=t=>{ if(!vac) return "fijo"; if(vac[t.id]) return "vac"; if(t.cuota) return "cuota"; return esFijoTx(t)?"fijo":"cons"; };

  const m=useMemo(()=>{
    if(!vac) return null;
    const inC=t=>cycleTx(t)===ciclo;
    const out=rows0.filter(t=>t.flow==="out"&&!t.excl&&inC(t));
    const sum=b=>out.filter(t=>bucketOf(t)===b).reduce((a,t)=>a+t.monto,0);
    const cons=sum("cons"), fijo=sum("fijo"), cuota=sum("cuota"), vacb=sum("vac");
    const reembVac=rows0.filter(t=>inC(t)&&catOf(t)==="Reembolso recibido"&&REEMB_VAC_IDS.has(t.id)).reduce((a,t)=>a+t.monto,0);
    const reembCons=rows0.filter(t=>inC(t)&&catOf(t)==="Reembolso recibido"&&!REEMB_VAC_IDS.has(t.id)).reduce((a,t)=>a+t.monto,0);
    const consN=cons-reembCons, vacN=vacb-reembVac;
    // Categorías: el detalle solo aplica al consumo del mes; todas las cuotas
    // y los gastos fijos se agrupan en las categorías agregadas "Cuotas mes" / "Gastos fijos mes"
    const byCat={};
    out.forEach(t=>{const b=bucketOf(t); if(b==="vac") return;
      const c=b==="cuota"?"Cuotas mes":b==="fijo"?"Gastos fijos mes":catOf(t);
      byCat[c]=(byCat[c]||0)+t.monto;});
    Object.entries(REEMB_CAT).forEach(([id,c])=>{const t=rows0.find(x=>x.id===id);if(t&&inC(t))byCat[c]=(byCat[c]||0)-t.monto;});
    const cats=Object.entries(byCat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    let donut=cats.slice(0,8); const rest=cats.slice(8).reduce((a,[,v])=>a+v,0);
    if(rest>0) donut=[...donut,["Otros agrupados",rest]];
    const gastBank=k=>BANKS[k].accts.reduce((a,acc)=>a+out.filter(t=>t.cuenta===acc).reduce((s,t)=>s+t.monto,0),0);
    const cuoMap={};
    rows0.filter(t=>t.cuota&&Number(t.cuota.de)>1).forEach(t=>{const k=planKey(t),p=cuoMap[k];
      if(!p){cuoMap[k]=t;return;} const d=cycleDiff(cycleTx(t),cycleTx(p));
      if(d>0||(d===0&&t.cuota.n>p.cuota.n)) cuoMap[k]=t;});
    const cuotas=Object.values(cuoMap).sort((a,b)=>b.cuota.pendiente-a.cuota.pendiente);
    const proxMes=cuotas.filter(t=>t.cuota.n<t.cuota.de).reduce((a,t)=>a+t.cuota.valor,0);
    const compromiso=cuotas.reduce((a,t)=>a+t.cuota.pendiente,0);
    const met=rows0.find(t=>inC(t)&&METLIFE_RE.test(t.comercio)); const metX=met?Math.round(met.monto*0.5):0;
    const cuotaEsp=out.filter(t=>bucketOf(t)==="cuota"&&esEsp(t)).reduce((a,t)=>a+t.monto,0);
    return {consN,fijo,cuota,cuotaEsp,vacN,donut,gastSTG:gastBank("STG"),gastCHL:gastBank("CHL"),cuotas,proxMes,compromiso,metX};
  },[ovr,vac,ciclo,rows0,fijos]);

  const rows=useMemo(()=>rows0.filter(t=>{
    if(cycleTx(t)!==ciclo) return false;
    if(soloVar&&(t.flow!=="out"||t.excl||bucketOf(t)!=="cons")) return false;
    if(!showExcl&&t.excl) return false;
    if(fAcc!=="todas"&&t.cuenta!==fAcc) return false;
    if(fCat!=="todas"&&catOf(t)!==fCat) return false;
    if(q&&!(t.comercio.toLowerCase().includes(q.toLowerCase())||(t.ciudad||"").toLowerCase().includes(q.toLowerCase()))) return false;
    return true;
  }).sort((a,b)=>a.fecha<b.fecha?1:-1),[ovr,fAcc,fCat,q,showExcl,ciclo,rows0,soloVar,fijos,vac]);

  // tripwire de duplicados: misma fecha+cuenta+monto+flow con id distinto
  const dupCands=useMemo(()=>{const seen={};let n=0;rows0.forEach(t=>{const k=t.fecha+"|"+t.cuenta+"|"+t.monto+"|"+t.flow;if(seen[k])n++;else seen[k]=1;});return n;},[rows0]);

  const ciclosL=useMemo(()=>[...new Set(rows0.map(t=>cycleTx(t)))].sort().reverse(),[rows0]);
  useEffect(()=>{ if(ciclosL.length&&!ciclosL.includes(ciclo)) setCiclo(ciclosL.includes(CICLO_HOY)?CICLO_HOY:ciclosL[0]); },[ciclosL]);

  const toggleFijo=(nombre)=>{ const key=ciclo+"|"+nombre;
    setFijoChk(p=>{const np={...p,[key]:!p[key]}; store.set("fijo:"+key,np[key]?"1":"0"); return np;}); };
  const fijosView=useMemo(()=>{
    const used=new Set();
    return fijos.filter(f=>f.activo).map(f=>{
      const pat=(f.patron||f.nombre).toLowerCase();
      // candidatos del ciclo por patrón; si varios fijos comparten patrón (ej. Smart Fit x2),
      // se asigna el cargo de monto más cercano al esperado, sin reutilizar transacciones
      const tx=rows0.filter(t=>cycleTx(t)===ciclo&&t.flow==="out"&&!t.excl&&!used.has(t.id)&&t.comercio.toLowerCase().includes(pat))
        .sort((a,b)=>Math.abs(a.monto-f.monto)-Math.abs(b.monto-f.monto))[0];
      if(tx) used.add(tx.id);
      const manual=!!fijoChk[ciclo+"|"+f.nombre];
      const pagado=!!tx||manual;
      const fEsp=fechaEsp(ciclo,f.dia);
      const atrasado=!pagado&&ciclo===CICLO_HOY&&fEsp<HOY;
      return {...f,tx,manual,pagado,atrasado,fEsp,montoReal:tx?tx.monto:f.monto};
    }).sort((a,b)=>a.fEsp<b.fEsp?-1:1);
  },[fijos,rows0,ciclo,fijoChk]);

  // cuotas proyectadas: avanza n desde el último estado conciliado hasta el ciclo actual
  const cuotasView=useMemo(()=>{
    if(!m) return {items:[],proy:[],totPend:0,totPendEsp:0,carga:0,cargaEsp:0,fin:null};
    const items=m.cuotas.map(t=>{
      const base=t.ciclo||cycleOf(t.fecha);
      const elapsed=Math.max(0,cycleDiff(CICLO_HOY,base));
      // n=0 ("00/N" en el estado): la primera cuota se factura en el ciclo de la fila
      const nRaw=(t.cuota.n>0?t.cuota.n:1)+elapsed;
      const restIncl=Math.max(0,t.cuota.de-nRaw+1);
      const nAct=Math.min(nRaw,t.cuota.de);
      const pend=restIncl*t.cuota.valor;
      const ultimo=restIncl>0?cycleAdd(CICLO_HOY,restIncl-1):null;
      return {...t,nAct,restIncl,pend,ultimo,estimado:elapsed>0,activa:restIncl>0,esp:esEsp(t)};
    }).sort((a,b)=>(a.activa===b.activa)?(a.pend<b.pend?1:-1):(a.activa?-1:1));
    const maxRest=items.reduce((a,t)=>Math.max(a,t.restIncl),0);
    const proy=[]; for(let k=0;k<maxRest;k++){
      const act=items.filter(t=>t.restIncl>k);
      proy.push({c:cycleAdd(CICLO_HOY,k),monto:act.reduce((a,t)=>a+t.cuota.valor,0),espM:act.filter(t=>t.esp).reduce((a,t)=>a+t.cuota.valor,0)});
    }
    const totPend=items.reduce((a,t)=>a+t.pend,0), totPendEsp=items.filter(t=>t.esp).reduce((a,t)=>a+t.pend,0);
    return {items,proy,totPend,totPendEsp,carga:proy.length?proy[0].monto:0,cargaEsp:proy.length?proy[0].espM:0,fin:proy.length?proy[proy.length-1].c:null};
  },[m]);

  if(!ready||!m) return <div className="wrap" style={{padding:24}}>Cargando…</div>;
  const restante=meta-m.consN;
  const ahorroBase=Math.max(restante,0);
  const totBar=m.consN+m.fijo+m.cuota;
  const totalDona=m.donut.reduce((a,[,v])=>a+v,0);
  const maxProy=cuotasView.proy.reduce((a,p)=>Math.max(a,p.monto),0);
  const BK={cons:{l:"Consumo",c:COL.cons},fijo:{l:"Fijo",c:COL.fijo},cuota:{l:"Cuota",c:COL.cuota},vac:{l:"✈ Vacaciones",c:"#E08A3C"}};
  const chartMeses=MESES.map(x=>({mes:x.mes,"Banco de Chile":x.bdcTC,"Santander":x.stgTC}));
  const chartAhorro=MESES.map(x=>({mes:x.mes,"Ahorro":x.ahorro,"Extra MetLife":x.ahorroX}));
  const totAhorro=MESES.reduce((a,x)=>a+x.ahorro,0), totAhorroX=MESES.reduce((a,x)=>a+x.ahorroX,0);
  const info=CICLO_INFO[ciclo];
  const gastTC=rows0.filter(t=>t.flow==="out"&&!t.excl&&cycleTx(t)===ciclo&&t.cuenta.includes("TC")).reduce((a,t)=>a+t.monto,0);
  const dataMax=rows0.reduce((a,t)=>t.fecha>a&&t.fecha<=HOY?t.fecha:a,"0000-00-00");
  const diasSin=Math.max(0,Math.round((new Date(HOY)-new Date(dataMax))/864e5));
  const totEsp=fijosView.reduce((a,f)=>a+f.monto,0);
  const totPag=fijosView.filter(f=>f.pagado).reduce((a,f)=>a+f.montoReal,0);
  const totPend=fijosView.filter(f=>!f.pagado).reduce((a,f)=>a+f.monto,0);
  // Base del ciclo (sin esperar facturación): fijos esperados (lista maestra + extras ya cargados) y cuotas proyectadas
  const fijoMatched=fijosView.reduce((a,f)=>a+(f.tx?f.montoReal:0),0);
  const fijoProj=ciclo===CICLO_HOY?totEsp+Math.max(0,m.fijo-fijoMatched):m.fijo;
  const dproj=cycleDiff(ciclo,CICLO_HOY);
  const pj=dproj>=0?(cuotasView.proy[dproj]||{monto:0,espM:0}):null;
  const cuotaProj=pj?pj.monto:m.cuota;
  const cuotaEspProj=pj?pj.espM:m.cuotaEsp;
  const sinCuotas=m.consN+fijoProj;
  const totCiclo=sinCuotas+cuotaProj;
  const sinEsp=v=>cuotaEspProj>0?<span className="sinesp">(sin {ESP_LBL}: {clp(v-cuotaEspProj)})</span>:null;
  const espByAcc=fijosView.reduce((o,f)=>{const k=ACC[f.cuenta]?f.cuenta:"—";o[k]=(o[k]||0)+f.monto;return o;},{});

  return (<div className="wrap">
   <style>{CSS}</style>
   <div className="main">
    <div className="hdr">
      <div><div className="eyebrow">Control de flujo personal</div><h1 className="h1">Mis finanzas</h1>
        <div className="chip" style={{marginTop:3}}>build {BUILD} · datos al {fdate(dataMax)} · fuente {fuente}</div></div>
      <div className="reserva"><span>🔒</span><span>Fondo a invertir (no disponible): <b className="num">{clp(RESERVA_CHL)}</b></span></div>
    </div>
    <div className="tabs">
      <button className={tab==="periodo"?"on":""} onClick={()=>setTab("periodo")}>Período</button>
      <button className={tab==="fijos"?"on":""} onClick={()=>setTab("fijos")}>Fijos</button>
      <button className={tab==="cuotas"?"on":""} onClick={()=>setTab("cuotas")}>Cuotas</button>
      <button className={tab==="meses"?"on":""} onClick={()=>setTab("meses")}>Meses</button>
    </div>
    {diasSin>2&&<div className="aside" style={{marginTop:10}}>⚠ Última transacción registrada: <b className="num">{fdate(dataMax)}</b> — hace {diasSin} días. Hay que procesar las notificaciones de Gmail nuevas (pídeselo a Claude).</div>}

    {tab==="periodo" && <>
    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",margin:"12px 0 0"}}>
      <span className="chip">Ciclo facturación BdC</span>
      <select className="filt" value={ciclo} onChange={e=>setCiclo(e.target.value)} style={{padding:"5px 8px",fontSize:12}}>
        {ciclosL.map(c=><option key={c} value={c}>{cycleLabel(c)+(c===CICLO_HOY?" · ciclo en curso":"")}</option>)}
      </select>
      {ciclo===CICLO_HOY&&<span className="chip" style={{color:"var(--save)",fontWeight:600}}>en curso · va en el día {HOY.slice(8)}</span>}
      {!info&&<span className="chip">sin estado de cuenta aún — cifras provisorias desde notificaciones</span>}
    </div>
    <div className="cardgrid" style={{marginTop:10}}>
      <div className="card" style={{background:COL.cons+"10",borderColor:COL.cons+"33"}}>
        <div className="lbl">Consumo del mes <span className="chip">(sin cuotas ni fijos)</span></div>
        <div className="big num" style={{color:COL.cons}}>{clp(m.consN)}</div>
        <div className="sub">meta <span className="editbox"><span style={{color:"var(--muted)"}}>$</span>
          <input className="num" type="number" step="50000" value={meta} onChange={e=>saveMeta(Math.max(0,parseInt(e.target.value||"0")))}/></span>
          {restante>=0 ? <> · sobran <b className="num" style={{color:"var(--save)"}}>{clp(restante)}</b></>
                       : <> · <b style={{color:COL.cons}}>{clp(-restante)} sobre la meta</b></>}
        </div>
      </div>
      <div className="card" style={{background:COL.fijo+"10",borderColor:COL.fijo+"33"}}>
        <div className="lbl">Gastos fijos mes {ciclo===CICLO_HOY&&<span className="chip">(base esperada)</span>}</div>
        <div className="big num" style={{color:COL.fijo}}>{clp(fijoProj)}</div>
        <div className="sub">{ciclo===CICLO_HOY?<>cargado {clp(m.fijo)} · pendiente {clp(Math.max(0,fijoProj-m.fijo))}</>:<>suscripciones, seguros, CAE, comisiones y lista maestra</>}</div>
      </div>
      <div className="card" style={{background:COL.cuota+"10",borderColor:COL.cuota+"33"}}>
        <div className="lbl">Cuotas mes {ciclo===CICLO_HOY&&<span className="chip">(proyectado)</span>}</div>
        <div className="big num" style={{color:COL.cuota}}>{clp(cuotaProj)}</div>
        {sinEsp(cuotaProj)}
        <div className="sub">{ciclo===CICLO_HOY?<>cargado a la fecha {clp(m.cuota)} · detalle en pestaña Cuotas</>:<>todas las cuotas del ciclo · detalle en pestaña Cuotas</>}</div>
      </div>
      <div className="card">
        <div className="lbl">Total del ciclo {ciclo===CICLO_HOY&&<span className="chip">(base esperada)</span>}</div>
        <div className="big num">{clp(totCiclo)}</div>
        {sinEsp(totCiclo)}
        <div className="sub">sin cuotas <b className="num">{clp(sinCuotas)}</b> · cuotas <b className="num">{clp(cuotaProj)}</b>

          </BarChart></ResponsiveContainer>

        <div className="chip">Acumulado ene–may: ahorro explícito <b className="num">{clp(totAhorro)}</b> + extra MetLife <b className="num">{clp(totAhorroX)}</b>.</div>
      </div>
    </div>

    <div className="panel" style={{marginTop:13,padding:"14px 16px 6px",overflow:"auto"}}>
      <div className="sectitle" style={{marginBottom:6}}>Balances principales por mes</div>
      <table className="mtab"><thead><tr>
        <th>Mes 2026</th><th className="rt">TC BdC</th><th className="rt">TC Santander</th><th className="rt">Total tarjetas</th>
        <th className="rt">Saldo Stg CC</th><th className="rt">Saldo BdC CC</th>
        <th className="rt">Ahorro</th><th className="rt">Extra MetLife</th>
      </tr></thead><tbody>
        {MESES.map(x=>(<tr key={x.mes}>
          <td style={{fontWeight:600}}>{x.mes}</td>
          <td className="n">{clp(x.bdcTC)}{x.intl&&<span className="chip num"> +{usd(x.intl)}</span>}</td>
          <td className="n">{clp(x.stgTC)}</td>
          <td className="n" style={{fontWeight:700}}>{clp(x.bdcTC+x.stgTC)}</td>
          <td className="n">{x.sStg!=null?clp(x.sStg):"—"}</td>
          <td className="n">{clp(x.sChl)}</td>
          <td className="n" style={{color:x.ahorro?COL.save:"inherit",fontWeight:x.ahorro?600:400}}>{x.ahorro?clp(x.ahorro):"—"}</td>
          <td className="n" style={{color:"#5E8A2E"}}>{clp(x.ahorroX)}</td>
        </tr>))}
      </tbody></table>
    </div>
    <div className="chip" style={{marginTop:12,lineHeight:1.6}}>
      Series desde los estados facturados (TC) y las cartolas (cuentas corrientes) de cada mes, conciliadas con sus totales de control.
      "Ahorro" son traspasos explícitos a cuenta de ahorro / fondo mutuo; "Extra MetLife" es el 50% del seguro que también acumula.
      Mayo es atípico por el viaje (financiado con ahorro). El saldo de BdC (~$22M) es el fondo a invertir y no se toca.
    </div>
    </>}

   </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
